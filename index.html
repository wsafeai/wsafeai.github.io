<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#062b3d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Field site safety assessment for WorkSafeAgent and wsafe.ai. Works on a phone, stores the walkthrough on the device." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>WSA Site Assessment</title>
    <script type="module" crossorigin src="/assets/index-bootfix-10402891.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/db-bootfix-d68e0d58.js">
    <link rel="stylesheet" crossorigin href="/assets/index-Bx5rFd-I.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  
    <script>
      // Boot recovery: if setup fails or the route is unknown, never leave a blank screen.
      (function () {
        var STUCK = ["Opening this assessment…", "Opening assessments saved on this device…", "Loading the assessment…", "Loading observation…", "Loading settings…"];
        function recover(reason) {
          var root = document.getElementById("root");
          if (!root) return;
          if (root.getAttribute("data-wsa-recovered")) return;
          var text = (root.innerText || "").trim();
          var empty = !root.childElementCount || text === "";
          var stuck = STUCK.some(function (s) { return text.indexOf(s) !== -1; });
          if (!empty && !stuck) return;
          root.setAttribute("data-wsa-recovered", "1");
          root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:28rem;margin:3rem auto;padding:0 1.25rem;color:#062b3d">'
            + '<p style="font-size:1.35rem;font-weight:700;margin:0 0 .5rem">This screen could not open.</p>'
            + '<p style="font-size:.95rem;line-height:1.45;color:#3b5160;margin:0 0 1rem">Assessments already saved on this phone are usually still there. Open the list to continue.</p>'
            + '<a href="/" style="display:inline-block;background:#062b3d;color:#fff;font-weight:600;text-decoration:none;border-radius:.75rem;padding:.75rem 1rem">Back to assessments</a>'
            + '</div>';
        }
        window.addEventListener("error", function () { setTimeout(function () { recover("error"); }, 50); });
        window.addEventListener("unhandledrejection", function () { setTimeout(function () { recover("reject"); }, 50); });
        setTimeout(function () { recover("timeout"); }, 4000);
      })();
    </script>
  </body>
</html>
